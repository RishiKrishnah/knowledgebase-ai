services:

  # ============================================================
  # BACKEND
  # ============================================================

  - type: web
    name: knowledgebase-backend
    runtime: python
    region: singapore
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"

      - key: DEBUG
        value: "false"

      # ========================================================
      # Supabase PostgreSQL
      # Set this manually in Render Dashboard
      # ========================================================
      - key: DATABASE_URL
        sync: false

      # ========================================================
      # Qdrant Cloud
      # ========================================================
      - key: QDRANT_URL
        sync: false

      - key: QDRANT_API_KEY
        sync: false

      # ========================================================
      # LLM
      # ========================================================
      - key: OPENROUTER_API_KEY
        sync: false

      # ========================================================
      # Security
      # ========================================================
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_ALGORITHM
        value: "HS256"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"

      # ========================================================
      # Frontend → Backend CORS
      # ========================================================
      - key: FRONTEND_ORIGIN
        value: "https://knowledgebase-frontend-4l5n.onrender.com"

      # ========================================================
      # Temporary filesystem
      # ========================================================
      - key: UPLOAD_DIRECTORY
        value: "/tmp/knowledgebase-uploads"


  # ============================================================
  # FRONTEND
  # ============================================================

  - type: web
    name: knowledgebase-frontend
    runtime: node
    region: singapore
    plan: free

    rootDir: frontend

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: "production"

      - key: NEXT_PUBLIC_API_URL
        value: "https://knowledgebase-backend-2xj6.onrender.com"